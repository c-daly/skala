ght="normal">4 × Ø4.5 at (±17.5,0), (0,±17.5): gearbox.</text><text x="10" y="125" font-size="2.8" font-weight="normal">4 × Ø3.4 at (±30,±12), CSK Ø6.4, outboard: blocks.</text><text x="10" y="129" font-size="2.8" font-weight="normal">4 × Ø3.4 at (±8,±29): cable post; use upper pair.</text><text x="10" y="133" font-size="2.8" font-weight="normal">Ø5.4 at (-26,0): stop pin.</text><text x="10" y="137" font-size="2.8" font-weight="normal">2 × Ø4.2 at (+18.385,±18.385): datum; use upper.</text><text x="115" y="25" font-size="3.5" font-weight="bold">RAILS: 6061-T6, 15 × 15 × 3 ANGLE, CUT 124</text><text x="120" y="54" font-size="2.8" font-weight="normal">Foot leg: Ø3.4, 8 / 24 / 67.5 from inboard end;</text><text x="120" y="59" font-size="2.8" font-weight="normal">6.5 from the inner edge of the horizontal leg.</text><text x="120" y="85" font-size="2.8" font-weight="normal">Upright leg: Ø3.4, 112 / 120 from inboard end;</text><text x="120" y="90" font-size="2.8" font-weight="normal">8 above underside. Mirror the two rail hands.</text><text x="120" y="100" font-size="3.2" font-weight="bold">BACKING STRIP: S355 STEEL, 20 × 36 × 2</text><text x="161" y="111" font-size="2.8" font-weight="normal">2 × Ø3.4, centres 16 apart;</text><text x="161" y="116" font-size="2.8" font-weight="normal">10 from ends, centred across width.</text><text x="120" y="135" font-size="2.8" font-weight="normal">Break edges. Hole positions ±0.1 unless fit noted.</text><text x="260" y="25" font-size="3.5" font-weight="bold">OUTPUT HUB: CUSTOM C45 STEEL</text><text x="260" y="100" font-size="2.8" font-weight="normal">Axial lengths: 6.4 + 10.1 + 5 = 21.5.</text><text x="260" y="104" font-size="2.8" font-weight="normal">Ø12 h6 bearing journal; Ø14 neck; Ø32 flange.</text><text x="260" y="108" font-size="2.8" font-weight="normal">Ø8 H7 through bore; keyway 3 JS9, t2 = 1.4.</text><text x="260" y="112" font-size="2.8" font-weight="normal">4 × M4 × 0.7 THRU flange, PCD24, cardinal.</text><text x="260" y="116" font-size="2.8" font-weight="normal">STEP thread cylinders show major diameter, NOT tap drill.</text><text x="260" y="120" font-size="2.8" font-weight="normal">Journal and bore concentric within 0.03; Ra ≤1.6 µm.</text><text x="260" y="124" font-size="2.8" font-weight="normal">Bearing shoulder radius ≤0.2; deburr keyway.</text><text x="260" y="128" font-size="2.8" font-weight="normal">Length ±0.1; flange face perpendicular to bore ≤0.05.</text><text x="260" y="132" font-size="2.8" font-weight="normal">Key: rounded 3 × 3 × 6; installed Z=99.4..105.4.</text><text x="260" y="136" font-size="2.8" font-weight="normal">Axial shim: ID8.2 / OD10; 0.5..2.5 to match shaft.</text><text x="260" y="140" font-size="2.8" font-weight="normal">Hub rear at Z=93; arm face at Z=114.5.</text><text x="10" y="155" font-size="3.5" font-weight="bold">RETAIN CHASSIS — DRILL ONLY THESE 16 EXISTING HOLES TO Ø5.2</text><text x="10" y="278" font-size="2.8" font-weight="normal">X = -88, -32, +32, +88; Y = -64, -48, +48, +64. All 16 combinations.</text><text x="10" y="283" font-size="2.8" font-weight="normal">Metal sleeves OD5 / ID3.2 × 6. Chassis footprint remains 200 × 152.</text><text x="175" y="160" font-size="3.5" font-weight="bold">SHAFTS, RETENTION AND ASSEMBLY DATUMS</text><text x="175" y="170" font-size="2.8" font-weight="normal">Input: Ø5 h6 ground steel, cut 27; cross-drill Ø2 at 5.3 from inboard end.</text><text x="175" y="175" font-size="2.8" font-weight="normal">Input support: NMB L-1150ZZ, 5 × 11 × 5, at Z=29.5..34.5; adjustable carrier.</text><text x="175" y="180" font-size="2.8" font-weight="normal">Output: 6901-2RS, 12 × 24 × 6. Its inner ring runs on the custom hub journal.</text><text x="175" y="185" font-size="2.8" font-weight="normal">Axial retention: M3 × 25, OD14 / ID3.2 × 1.5 washer, OD10 / ID3.2 × 10 spacer.</text><text x="175" y="190" font-size="2.8" font-weight="normal">Arm: four M4 × 16, OD9 × 0.8 washers, OD6 / ID4.3 × 10 metal sleeves.</text><text x="175" y="195" font-size="2.8" font-weight="normal">Gearbox: four M4 × 20 BUTTON heads, height ≤2.2; cap sleeves OD6 / ID4.3 × 9.</text><text x="175" y="200" font-size="2.8" font-weight="normal">Stop: M5 × 45 with 23 smooth shank / 22 thread. Head seat Z=125.5.</text><text x="175" y="205" font-size="2.8" font-weight="normal">Two M5 nuts lock the stop to the end plate; smooth shank spans the arm slot.</text><text x="175" y="210" font-size="2.8" font-weight="normal">Soft pitch ±50°. Hard slot nominal ±55° (+about 0.44° running clearance).</text><text x="175" y="215" font-size="2.8" font-weight="normal">Index tool: Ø4 × 50 steel pin, knob shoulder leaves 35.5 insertion depth.</text><text x="175" y="220" font-size="2.8" font-weight="normal">Insert only at zero pitch on a supported corner; withdraw before energising motion.</text><text x="175" y="225" font-size="2.8" font-weight="normal">Input-carrier feet at X=±28, Z=31.5; M3×16, 6 mm sleeves, 0.3 mm nominal shims.</text><text x="175" y="230" font-size="2.8" font-weight="normal">Coordinates above use the corner frame: X along arm, Y up, Z outboard.</text><text x="175" y="235" font-size="2.8" font-weight="normal">Robot map: horn Y=±76; arm face Y=±190.5; pitch axes X=±60, Z=17.55.</text><text x="175" y="240" font-size="2.8" font-weight="normal">All lengths nominal. Qualify actual fit, lead flex, fuse, load and temperature first.</text><text x="175" y="268" font-size="2.8" font-weight="normal">100 mm scale bar — this SVG sheet is 420 × 297 mm.</text><text x="175" y="281" font-size="2.8" font-weight="normal">Source: reduction_p0.py, parts/pitch_reduction_p0.py, bom_r1.json.</text></g></svg>