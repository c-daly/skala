<text x='40' y='470' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#6b7280'>Match both wheels of an arm, and the skid wheels, to the same 47 mm inner-face distance; the tip axle slides in its slot to set it. Track width on the chassis is 152 + 2 × (69) ≈ 290 mm overall.</text>
<text x='40' y='490' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#6b7280'>Drive wheel: bolted straight to the drive servo horn, which protrudes from the housing's outboard face. Tip wheel: on the tip hub (2 × 608) over the 8 mm axle clamped in the boss.</text>
