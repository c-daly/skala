<text x='40' y='510' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#6b7280'>Match both wheels of an arm, and the skid wheels, to the same 50 mm inner-face distance (the tip bolt slides in its slot). Overall track width 152 + 2 × 72 ≈ 296 mm.</text>
<text x='40' y='530' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#6b7280'>The horn is flush with the case, so the spacer (Ø20 step on the horn, Ø26 above) keeps the arm 6 mm off the case and 7 mm off the mount. Drive wheel on the drive horn, 1 mm proud of the housing; tip wheel on the hub (Fig. 11).</text>
