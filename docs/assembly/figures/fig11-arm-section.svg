<rect x='153.7' y='186.1' width='204.6' height='68.2' fill='#e5e7eb' stroke='#1f2328' stroke-width='1.3' opacity='1'/>
<text x='153.7' y='173.7' font-family='Helvetica, Arial, sans-serif' font-size='10' fill='#1f2328' text-anchor='start' font-weight='normal'>TB3 wheel bolted to the horn (drive sprocket)</text>
<rect x='641.4' y='334.9' width='74.4' height='65.1' fill='#fde68a' stroke='#92400e' stroke-width='1.3' opacity='1'/>
