<text x='40' y='585' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#6b7280'>Tip order on the M6 x 50 bolt, head first: hub (head in its pocket, bearings and spacer inside) → spacer → boss slot → washer → nylock. Hold the head with a 10 mm spanner while tightening.</text>
<text x='40' y='603' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#6b7280'>The boss slot lets the bolt move ±4 mm along the arm for track tension; the nylock clamps it. No clamp screw, collar or cut rod any more.</text>
