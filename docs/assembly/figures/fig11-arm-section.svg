<text x='622.8' y='300.8' font-family='Helvetica, Arial, sans-serif' font-size='10' fill='#3730a3' text-anchor='end' font-weight='normal'>tip hub: 2 × 608 pressed in, inner races on the axle</text>
<text x='622.8' y='266.7' font-family='Helvetica, Arial, sans-serif' font-size='10' fill='#3730a3' text-anchor='end' font-weight='normal'>hub flange → 4 × M2 into the wheel</text>
<rect x='576.3' y='195.4' width='204.6' height='68.2' fill='#e5e7eb' stroke='#1f2328' stroke-width='1.3' opacity='1'/>
<text x='567.0' y='226.4' font-family='Helvetica, Arial, sans-serif' font-size='10' fill='#1f2328' text-anchor='end' font-weight='normal'>TB3 wheel, free-wheeling (idler)</text>
<rect x='656.9' y='167.5' width='43.4' height='24.8' fill='#374151' stroke='#1f2328' stroke-width='1.3' opacity='1'/>
<text x='647.6' y='173.7' font-family='Helvetica, Arial, sans-serif' font-size='10' fill='#1f2328' text-anchor='end' font-weight='normal'>8 mm shaft collar (set screw) — stops the hub walking off</text>
<line x1='70.0' y1='254.3' x2='802.6150715377643' y2='254.3' stroke='#c2410c' stroke-width='1' stroke-dasharray='6 4'/>
<text x='70.0' y='245.0' font-family='Helvetica, Arial, sans-serif' font-size='10' fill='#c2410c' text-anchor='start' font-weight='normal'>wheel plane: 47 from the arm's inboard face (47 from the plate edge)</text>
<text x='40' y='560' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#6b7280'>Tip assembly order: axle through the boss slot → washer → hub (flange outboard) → wheel onto the flange → collar. Slide the hub to match the drive wheel's plane, then tighten clamp and collar.</text>
<text x='40' y='580' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#6b7280'>The boss slot lets the axle move ±4 mm along the arm for track tension. The split in the boss lets the M3 pinch the axle; without it a PLA cylinder would not grip.</text>
</svg>