<text x='564.0' y='363.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal'>out of the side window, through the cut,</text>
<text x='564.0' y='377.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal'>down the slot at (22, ±21), out on the inboard face</text>
