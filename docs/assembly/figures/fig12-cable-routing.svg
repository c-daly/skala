<text x='564.0' y='1198.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal'>the arm's spacer sits on the horn here</text>
<circle cx='140.0' cy='1162.0' r='3.5' fill='#6b7280'/>
<line x1='140.0' y1='1162.0' x2='560' y2='1225' stroke='#6b7280' stroke-width='1.1'/>
<text x='564.0' y='1229.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#6b7280' text-anchor='start' font-weight='bold'>Deck edge y = 60</text>
<text x='564.0' y='1243.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal'>the deck covers the inboard half of the mount</text>
<text x='40.0' y='1300.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b7280' text-anchor='start' font-weight='normal'>Same rule in both parts: the end face stays open so the plugs can go in; the printed wall over each side window is cut away so the wire can come out.</text>
<text x='40.0' y='1320.0' font-family='Helvetica, Arial, sans-serif' font-size='11.5' fill='#6b7280' text-anchor='start' font-weight='normal'>`cad/check_p0.py` models both exits of every servo as keep-out volumes and fails if any printed part enters them — it fails on the previous arm and mount.</text>
</svg>