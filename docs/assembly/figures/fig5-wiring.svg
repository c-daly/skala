<rect x='560' y='400' width='120' height='56' rx='6' fill='#fff7ed' stroke='#c2410c' stroke-width='1.5'/>
<text x='620.0' y='428.0' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='bold' fill='#1f2328' text-anchor='middle'>ID 4</text>
<text x='620.0' y='445.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#6b7280' text-anchor='middle'>right drive</text>
<rect x='720' y='400' width='120' height='56' rx='6' fill='#eff6ff' stroke='#1d4ed8' stroke-width='1.5'/>
<text x='780.0' y='428.0' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='bold' fill='#1f2328' text-anchor='middle'>ID 5–8</text>
<text x='780.0' y='445.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#6b7280' text-anchor='middle'>rear arms, config A only</text>
<line x1='200' y1='428' x2='240' y2='428' stroke='#1d4ed8' stroke-width='2'/>
<line x1='360' y1='428' x2='400' y2='428' stroke='#1d4ed8' stroke-width='2'/>
<line x1='520' y1='428' x2='560' y2='428' stroke='#1d4ed8' stroke-width='2'/>
<line x1='680' y1='428' x2='720' y2='428' stroke='#1d4ed8' stroke-width='2' stroke-dasharray='6 4'/>
<text x='40' y='500' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#6b7280'>Drive-servo leads (IDs 3, 4, and 7, 8 in A) leave the arm through the pivot-side cable slot. Leave a ~120 mm service loop tied to the mount, not the arm:</text>
<text x='40' y='518' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#6b7280'>it allows ±200° of pitch and limits rotation in P0; the firmware pitch limits must match it. Pitch-servo leads exit the back of each mount along the plate edge.</text>
<text x='40' y='560' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#1f2328' font-weight='bold'>Power-up order:</text>
<text x='150' y='560' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#1f2328'>power bank → Pi boots → LiPo → OpenCR boots with torque off → ping all IDs → limits loaded → torque on one servo at a time.</text>
</svg>