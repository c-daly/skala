<line x1='470' y1='170' x2='560' y2='170' stroke='#b45309' stroke-width='2'/><text x='478' y='190' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#b45309'>5 V (OpenCR 5 V header, or a separate buck — see text)</text>
<rect x='80' y='300' width='120' height='56' rx='6' fill='#f3f4f6' stroke='#1f2328' stroke-width='1.5'/>
<text x='140.0' y='328.0' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='bold' fill='#1f2328' text-anchor='middle'>ID 2</text>
<text x='140.0' y='345.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#6b7280' text-anchor='middle'>right pitch</text>
<rect x='240' y='300' width='120' height='56' rx='6' fill='#f3f4f6' stroke='#1f2328' stroke-width='1.5'/>
