<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 640' width='1000' height='640'>
<rect width='100%' height='100%' fill='white'/>
<text x='20' y='30' font-family='Helvetica, Arial, sans-serif' font-size='20' font-weight='bold' fill='#1f2328'>Figure 6 — Rear skid (configuration B), side view from outboard</text><text x='20' y='50' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#6b7280'>Passive arm on an 8 mm pivot; angle fixed by one M3 pin through the arm and one of four bracket holes. 1 mm = 3 px. Rear of the robot is to the left.</text>
<rect x='340' y='312' width='560' height='18' fill='#f3f4f6' stroke='#1f2328' stroke-width='1.5'/>
<text x='910' y='326' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#6b7280'>chassis plate</text>
