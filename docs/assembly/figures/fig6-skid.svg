<text x='560' y='124' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#1d4ed8' text-anchor='middle' font-weight='bold'>skid bracket (upright, 56 × 60; foot on the grid)</text>
<circle cx='626.0' cy='270.0' r='4' fill='white' stroke='#1d4ed8' stroke-width='1.5'/>
