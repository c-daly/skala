<text x='265.1' y='593' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#1f2328' text-anchor='middle'>TB3 wheel (Ø66) on a tip hub, free-rolling</text>
<text x='305.1' y='367' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#1f2328'>skid arm, 120 mm pivot to tip; same tip boss and clamp as the flipper arm</text>
<text x='40' y='620' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#6b7280'>0° = flat pose. 35° matches the front flippers at 30° down so all four wheels sit level. Change the angle by moving one pin.</text>
