<text x='530' y='102' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#c2410c' font-weight='bold' text-anchor='end'>index pin (M3) in the 35° hole</text>
<text x='530' y='116' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#6b7280' text-anchor='end'>the arm's index hole is opposite its tip: as the tip drops, the hole rises</text>
<line x1='614.1' y1='232.1' x2='532' y2='106' stroke='#c2410c' stroke-width='0.8'/>
