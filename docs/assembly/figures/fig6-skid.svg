<line x1='560' y1='270' x2='265.1' y2='476.5' stroke='#e5e7eb' stroke-width='14' stroke-linecap='round'/>
<circle cx='560' cy='270' r='10' fill='white' stroke='#1f2328' stroke-width='2'/>
<text x='710' y='286' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328'>8 mm pivot axle through the bracket,</text>
<text x='710' y='301' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328'>clamped in the arm by an M3 × 16</text>
