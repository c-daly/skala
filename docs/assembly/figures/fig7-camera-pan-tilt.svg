<text x='40' y='540' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#6b7280'>Centre both servos before fitting horns. Pan servo lead and the CSI ribbon need a loose loop above the pan base. No feedback on MG90S: firmware reports the setpoint.</text>
