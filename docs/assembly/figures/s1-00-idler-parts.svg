<circle cx="734.0" cy="372.3538290724796" r="12.299999999999999" fill="white" stroke="#156f50" stroke-width="2"/>
<circle cx="734.0" cy="372.3538290724796" r="7.199999999999999" fill="white" stroke="#156f50" stroke-width="2"/>
<text x="900" y="285" font-size="17" fill="#156f50" text-anchor="start" font-weight="700">Three countersinks</text>
<text x="900" y="315" font-size="16" fill="#172b3a" text-anchor="start" font-weight="400">Ø30 × 2 thick</text>
<text x="900" y="338" font-size="16" fill="#172b3a" text-anchor="start" font-weight="400">Ø17 opening</text>
<text x="900" y="361" font-size="16" fill="#172b3a" text-anchor="start" font-weight="400">Ø24 screw circle</text>
<text x="645" y="445" font-size="17" fill="#172b3a" text-anchor="start" font-weight="700">Shallow circular relief on the OTHER side</text>
<text x="645" y="473" font-size="16" fill="#172b3a" text-anchor="start" font-weight="400">faces the bearing. Cap screws face the carrier.</text>
<line x1="645" y1="510" x2="1150" y2="510" stroke="#d4dde3" stroke-width="2"/>
<text x="645" y="550" font-size="19" fill="#a64c13" text-anchor="start" font-weight="700">P4 Hub spacer — hub_spacer_p0.stl</text>
<circle cx="715" cy="640" r="47.5" fill="#ffe2c2" stroke="#a64c13" stroke-width="2"/>
<circle cx="715" cy="640" r="31.5" fill="white" stroke="#a64c13" stroke-width="2"/>
<rect x="800" y="592.5" width="30" height="95" rx="0" fill="#ffe2c2" stroke="#a64c13" stroke-width="2"/>
<line x1="800" y1="608.5" x2="830" y2="608.5" stroke="#a64c13" stroke-width="2" stroke-dasharray="7 5"/>
<line x1="800" y1="671.5" x2="830" y2="671.5" stroke="#a64c13" stroke-width="2" stroke-dasharray="7 5"/>
<text x="875" y="620" font-size="16" fill="#172b3a" text-anchor="start" font-weight="400">Plain ring</text>
<text x="875" y="643" font-size="16" fill="#172b3a" text-anchor="start" font-weight="400">Ø9.5 / Ø6.3 / 3 thick</text>
<text x="875" y="666" font-size="16" fill="#172b3a" text-anchor="start" font-weight="400">Two per idler</text>
<text x="645" y="735" font-size="16" fill="#172b3a" text-anchor="start" font-weight="400">One between bearings; one inside P8&#x27;s opening</text>
<text x="645" y="762" font-size="16" fill="#172b3a" text-anchor="start" font-weight="400">between rear inner ring and carrier boss.</text>
<rect x="645" y="795" width="505" height="90" rx="8" fill="#f0f3f5" stroke="#d4dde3" stroke-width="2"/>
<text x="662" y="824" font-size="18" fill="#172b3a" text-anchor="start" font-weight="700">Not the four-hole pivot disc</text>
<text x="662" y="852" font-size="16" fill="#526473" text-anchor="start" font-weight="400">pivot_spacer_p0.stl is a different, unused part.</text>
<text x="34" y="938" font-size="14" fill="#526473" text-anchor="start" font-weight="400">P3 Tip hub: tip_hub_p0.stl   |   P4 Hub spacer: hub_spacer_p0.stl</text>
<text x="34" y="962" font-size="14" fill="#526473" text-anchor="start" font-weight="400">P8 Idler bearing cap: idler_bearing_cap_s1.stl</text>
<line x1="34" y1="967" x2="1166" y2="967" stroke="#d4dde3" stroke-width="2"/>
<text x="34" y="991" font-size="14" fill="#526473" text-anchor="start" font-weight="400">S0/S1 candidate • simplified assembly illustration • dimensions in mm • not a fabrication template</text>
