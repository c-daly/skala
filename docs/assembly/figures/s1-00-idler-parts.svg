<text x="34" y="38" font-size="26" fill="#172b3a" text-anchor="start" font-weight="700">Identify the revised idler: P3 + P8 + two P4 rings</text>
<text x="34" y="67" font-size="17" fill="#526473" text-anchor="start" font-weight="400">R2 hub has THREE rear cap pilots; FOUR front holes attach the wheel</text>
<line x1="34" y1="83" x2="1166" y2="83" stroke="#d4dde3" stroke-width="2"/>
<text x="45" y="125" font-size="21" fill="#236493" text-anchor="start" font-weight="700">P3 Tip hub — tip_hub_p0.stl</text>
<text x="45" y="155" font-size="16" fill="#526473" text-anchor="start" font-weight="400">ACTUAL CAD SECTION • wheel side left</text>
