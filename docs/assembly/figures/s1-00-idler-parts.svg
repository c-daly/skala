<line x1="425" y1="320" x2="302" y2="320" stroke="#156f50" stroke-width="3" marker-end="url(#arrow)"/>
<text x="345" y="285" font-size="17" fill="#156f50" text-anchor="start" font-weight="700">Bearings enter</text>
<text x="345" y="310" font-size="16" fill="#156f50" text-anchor="start" font-weight="400">from rear</text>
<line x1="120" y1="463" x2="120" y2="477" stroke="#172b3a" stroke-width="2"/>
<line x1="292" y1="463" x2="292" y2="477" stroke="#172b3a" stroke-width="2"/>
<line x1="120" y1="470" x2="292" y2="470" stroke="#172b3a" stroke-width="1"/>
<text x="206.0" y="460" font-size="16" fill="#172b3a" text-anchor="middle" font-weight="400">21.5 overall length</text>
<text x="45" y="510" font-size="18" fill="#172b3a" text-anchor="start" font-weight="700">Ø30 flange and rear collar / Ø27 waist</text>
<text x="45" y="540" font-size="16" fill="#172b3a" text-anchor="start" font-weight="400">Ø19.3 bore × 15 deep; three rear Ø1.7 pilots</text>
<text x="45" y="570" font-size="16" fill="#172b3a" text-anchor="start" font-weight="400">Front Ø11 opening clears the M6 head.</text>
<text x="45" y="600" font-size="16" fill="#172b3a" text-anchor="start" font-weight="400">Rear collar accepts P8 and three H8 screws.</text>
<rect x="45" y="650" width="530" height="140" rx="8" fill="#f0f3f5" stroke="#d4dde3" stroke-width="2"/>
<text x="62" y="679" font-size="18" fill="#172b3a" text-anchor="start" font-weight="700">Replace the earlier hub</text>
<text x="62" y="707" font-size="16" fill="#526473" text-anchor="start" font-weight="400">A hub without the three rear pilots cannot accept P8.</text>
<text x="62" y="730" font-size="16" fill="#526473" text-anchor="start" font-weight="400">The previous bearing fit alone did not retain it.</text>
<text x="62" y="753" font-size="16" fill="#526473" text-anchor="start" font-weight="400">No drilling is specified for this revised print.</text>
<line x1="610" y1="110" x2="610" y2="850" stroke="#d4dde3" stroke-width="2"/>
<text x="645" y="125" font-size="21" fill="#156f50" text-anchor="start" font-weight="700">P8 Idler bearing cap</text>
<text x="645" y="155" font-size="18" fill="#156f50" text-anchor="start" font-weight="400">idler_bearing_cap_s1.stl</text>
<text x="645" y="185" font-size="15" fill="#526473" text-anchor="start" font-weight="400">CARRIER-FACING SIDE • countersinks visible</text>
