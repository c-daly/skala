<text x="62" y="639" font-size="18" fill="#172b3a" text-anchor="start" font-weight="700">Fit the terminated lead to the motor BEFORE seating the motor in P1</text>
<text x="62" y="667" font-size="16" fill="#526473" text-anchor="start" font-weight="400">Dress the wires in the motor&#x27;s molded channel. Use the side opening that will face UP on the vehicle.</text>
<text x="62" y="690" font-size="16" fill="#526473" text-anchor="start" font-weight="400">The plug does not pass through the plate. The R12 bend and restraint keep the lead away from the track.</text>
