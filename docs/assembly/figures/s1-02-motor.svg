<text x="440" y="565" font-size="19" fill="#172b3a" text-anchor="start" font-weight="700">H1  Four M2.6 × 5 tapping screws per motor</text>
<text x="440" y="598" font-size="17" fill="#172b3a" text-anchor="start" font-weight="400">Use both filled UPPER positions on EACH side.</text>
<text x="440" y="622" font-size="17" fill="#172b3a" text-anchor="start" font-weight="400">Upper row: nearer the horn face (outboard).</text>
<text x="440" y="646" font-size="17" fill="#172b3a" text-anchor="start" font-weight="400">Lower row: nearer the carrier plate — leave empty.</text>
<text x="440" y="670" font-size="17" fill="#172b3a" text-anchor="start" font-weight="400">Seat all four heads in their recesses.</text>
<text x="440" y="694" font-size="17" fill="#172b3a" text-anchor="start" font-weight="400">Use supplied tapping screws; add no washers.</text>
<text x="440" y="715" font-size="16" fill="#526473" text-anchor="start" font-weight="400">The thin wall under each screw head is 2 mm.</text>
<text x="440" y="738" font-size="16" fill="#526473" text-anchor="start" font-weight="400">The four-screw arrangement still needs loaded qualification.</text>
