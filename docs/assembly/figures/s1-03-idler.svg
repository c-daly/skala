<circle cx="210" cy="820" r="22.05" fill="white" stroke="#a64c13" stroke-width="2"/>
<text x="45" y="963" font-size="17" fill="#156f50" text-anchor="start" font-weight="700">Three H8 M2×6 flat countersunk screws</text>
<text x="45" y="990" font-size="16" fill="#172b3a" text-anchor="start" font-weight="400">Four M2×4 wheel screws are on the OTHER end.</text>
<text x="490" y="720" font-size="20" fill="#172b3a" text-anchor="start" font-weight="700">Assembly order</text>
<text x="490" y="755" font-size="17" fill="#172b3a" text-anchor="start" font-weight="400">1  Seat first bearing from rear. Feed axle shaft</text>
<text x="515" y="782" font-size="17" fill="#172b3a" text-anchor="start" font-weight="400">from wheel side; head stops on inner ring.</text>
<text x="490" y="820" font-size="17" fill="#172b3a" text-anchor="start" font-weight="400">2  Add inner P4, second bearing, then P8 + H8 ×3.</text>
<text x="515" y="847" font-size="17" fill="#172b3a" text-anchor="start" font-weight="400">Relief faces bearing; heads face carrier.</text>
<text x="490" y="885" font-size="17" fill="#172b3a" text-anchor="start" font-weight="400">3  Add external P4; mount on carrier; clamp axle.</text>
<text x="490" y="923" font-size="17" fill="#172b3a" text-anchor="start" font-weight="400">4  Attach wheel to front with four H2 M2×4 screws.</text>
<text x="490" y="971" font-size="18" fill="#a64c13" text-anchor="start" font-weight="700">Turn AND pull: wheel must rotate freely and</text>
<text x="490" y="1000" font-size="18" fill="#a64c13" text-anchor="start" font-weight="700">stay captured with the axle tightened.</text>
<text x="45" y="1044" font-size="15" fill="#526473" text-anchor="start" font-weight="400">Nominal CAD retention is checked; printed fit, cap threads and loaded pull-out strength still need physical tests.</text>
<text x="34" y="1098" font-size="14" fill="#526473" text-anchor="start" font-weight="400">P1 Track carrier: track_carrier_s1.stl   |   P3 Tip hub: tip_hub_p0.stl</text>
<text x="34" y="1122" font-size="14" fill="#526473" text-anchor="start" font-weight="400">P4 Hub spacer: hub_spacer_p0.stl   |   P8 Idler bearing cap: idler_bearing_cap_s1.stl</text>
<line x1="34" y1="1127" x2="1166" y2="1127" stroke="#d4dde3" stroke-width="2"/>
<text x="34" y="1151" font-size="14" fill="#526473" text-anchor="start" font-weight="400">S0/S1 candidate • simplified assembly illustration • dimensions in mm • not a fabrication template</text>
