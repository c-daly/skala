<text x="535" y="195" font-size="16" fill="#526473" text-anchor="start" font-weight="400">One cap screw cut by this section</text>
<circle cx="638" cy="255" r="3" fill="#236493" stroke="#236493" stroke-width="2"/>
<line x1="638" y1="255" x2="892" y2="259" stroke="#236493" stroke-width="1.5"/>
<text x="900" y="265" font-size="18" fill="#236493" text-anchor="start" font-weight="700">P1 carrier boss</text>
<text x="900" y="290" font-size="16" fill="#526473" text-anchor="start" font-weight="400">Fixed axle support</text>
<circle cx="781" cy="409" r="3" fill="#172b3a" stroke="#172b3a" stroke-width="2"/>
