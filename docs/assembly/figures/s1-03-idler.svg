<text x="900" y="465" font-size="18" fill="#172b3a" text-anchor="start" font-weight="700">H5 washer + nyloc</text>
<text x="900" y="490" font-size="16" fill="#526473" text-anchor="start" font-weight="400">Clamps inner-ring stack</text>
<line x1="65" y1="365" x2="253" y2="365" stroke="#156f50" stroke-width="3" marker-end="url(#arrow)"/>
<text x="45" y="345" font-size="16" fill="#156f50" text-anchor="start" font-weight="700">5 mm key</text>
<text x="45" y="399" font-size="15" fill="#526473" text-anchor="start" font-weight="400">Head recessed</text>
<text x="45" y="422" font-size="15" fill="#526473" text-anchor="start" font-weight="400">behind wheel</text>
<circle cx="465.3" cy="475" r="3" fill="#156f50" stroke="#156f50" stroke-width="2"/>
<line x1="465.3" y1="475" x2="452" y2="564" stroke="#156f50" stroke-width="1.5"/>
<text x="460" y="570" font-size="18" fill="#156f50" text-anchor="start" font-weight="700">P8 catches rear OUTER ring</text>
<text x="460" y="595" font-size="16" fill="#526473" text-anchor="start" font-weight="400">Ø17 opening; 0.2 mm nominal axial play</text>
<circle cx="187" cy="453" r="3" fill="#172b3a" stroke="#172b3a" stroke-width="2"/>
<line x1="187" y1="453" x2="37" y2="552" stroke="#172b3a" stroke-width="1.5"/>
<text x="45" y="558" font-size="18" fill="#172b3a" text-anchor="start" font-weight="700">H2 wheel screws</text>
<text x="45" y="583" font-size="16" fill="#526473" text-anchor="start" font-weight="400">Four M2×4 pan heads</text>
<circle cx="473" cy="409" r="3" fill="#a64c13" stroke="#a64c13" stroke-width="2"/>
<line x1="473" y1="409" x2="817" y2="564" stroke="#a64c13" stroke-width="1.5"/>
<text x="825" y="570" font-size="18" fill="#a64c13" text-anchor="start" font-weight="700">P4 external spacer</text>
<text x="825" y="595" font-size="16" fill="#526473" text-anchor="start" font-weight="400">Passes through cap; remains 3 mm</text>
<text x="45" y="625" font-size="17" fill="#172b3a" text-anchor="start" font-weight="700">Cap and flush heads clear carrier by 1 mm. The cap is not in the axle&#x27;s inner-ring clamping stack.</text>
<line x1="35" y1="650" x2="1165" y2="650" stroke="#d4dde3" stroke-width="2"/>
<text x="45" y="690" font-size="19" fill="#172b3a" text-anchor="start" font-weight="700">B. Rear view — cap screws face the carrier</text>
