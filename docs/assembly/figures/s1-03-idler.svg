<text x="275" y="195" font-size="16" fill="#526473" text-anchor="start" font-weight="400">19.3 mm bearing cavity</text>
<circle cx="467.5" cy="216.5" r="3" fill="#156f50" stroke="#156f50" stroke-width="2"/>
