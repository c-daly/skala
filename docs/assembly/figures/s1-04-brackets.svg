<text x="528.0" y="390" font-size="16" fill="#526473" text-anchor="middle" font-weight="400">washer</text>
<rect x="584" y="215.0" width="55" height="90" rx="0" fill="#b5c0c9" stroke="#172b3a" stroke-width="2"/>
<text x="611.5" y="390" font-size="16" fill="#526473" text-anchor="middle" font-weight="400">nyloc</text>
<line x1="95" y1="260" x2="654" y2="260" stroke="#172b3a" stroke-width="7"/>
<line x1="80" y1="420" x2="654" y2="420" stroke="#236493" stroke-width="2" marker-end="url(#arrow)"/>
<text x="80" y="452" font-size="18" fill="#236493" text-anchor="start" font-weight="700">M4 × 25 enters from INBOARD → OUTBOARD</text>
<text x="80" y="475" font-size="16" fill="#526473" text-anchor="start" font-weight="400">Two washers per bolt; one under the head, one under the nut.</text>
<rect x="820" y="155" width="335" height="140" rx="8" fill="#f0f3f5" stroke="#d4dde3" stroke-width="2"/>
<text x="837" y="184" font-size="18" fill="#172b3a" text-anchor="start" font-weight="700">H3  Per bracket</text>
<text x="837" y="212" font-size="16" fill="#526473" text-anchor="start" font-weight="400">2 × M4 × 25 bolts</text>
<text x="837" y="235" font-size="16" fill="#526473" text-anchor="start" font-weight="400">4 × M4 washers</text>
<text x="837" y="258" font-size="16" fill="#526473" text-anchor="start" font-weight="400">2 × M4 nyloc nuts</text>
<rect x="820" y="320" width="335" height="140" rx="8" fill="#f0f3f5" stroke="#d4dde3" stroke-width="2"/>
<text x="837" y="349" font-size="18" fill="#172b3a" text-anchor="start" font-weight="700">Seat the bracket</text>
<text x="837" y="377" font-size="16" fill="#526473" text-anchor="start" font-weight="400">The upright meets the carrier.</text>
<text x="837" y="400" font-size="16" fill="#526473" text-anchor="start" font-weight="400">The foot points inboard.</text>
<text x="837" y="423" font-size="16" fill="#526473" text-anchor="start" font-weight="400">Leave the chassis holes clear.</text>
<text x="45" y="540" font-size="19" fill="#172b3a" text-anchor="start" font-weight="700">B. Chassis foot joint — upper upright omitted</text>
<rect x="100" y="690" width="390" height="30" rx="0" fill="#f0f3f5" stroke="#172b3a" stroke-width="2"/>
<rect x="370" y="660" width="180" height="30" rx="0" fill="#ffe2c2" stroke="#a64c13" stroke-width="2"/>
