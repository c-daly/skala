<rect x="372.5" y="720" width="35" height="2.5" rx="0" fill="#b5c0c9" stroke="#172b3a" stroke-width="2"/>
<rect x="376.25" y="722.5" width="27.5" height="20" rx="0" fill="#b5c0c9" stroke="#172b3a" stroke-width="2"/>
<circle cx="390" cy="648" r="3" fill="#172b3a" stroke="#172b3a" stroke-width="2"/>
<line x1="390" y1="648" x2="188.625" y2="589" stroke="#172b3a" stroke-width="1.5"/>
<text x="48" y="595" font-size="18" fill="#172b3a" text-anchor="start" font-weight="700">H4  M3 × 20</text>
<text x="48" y="620" font-size="16" fill="#526473" text-anchor="start" font-weight="400">Head above foot</text>
<circle cx="390" cy="735" r="3" fill="#172b3a" stroke="#172b3a" stroke-width="2"/>
<line x1="390" y1="735" x2="432" y2="766" stroke="#172b3a" stroke-width="1.5"/>
<text x="440" y="772" font-size="18" fill="#172b3a" text-anchor="start" font-weight="700">Washer + nyloc below chassis</text>
<text x="720" y="560" font-size="18" fill="#172b3a" text-anchor="start" font-weight="700">4 × H4 sets per bracket; 16 for the vehicle</text>
<text x="720" y="600" font-size="17" fill="#172b3a" text-anchor="start" font-weight="400">Top to bottom:</text>
<text x="720" y="624" font-size="17" fill="#172b3a" text-anchor="start" font-weight="400">head → washer → 6 mm foot →</text>
<text x="720" y="648" font-size="17" fill="#172b3a" text-anchor="start" font-weight="400">6 mm chassis → washer → nyloc</text>
<text x="720" y="720" font-size="17" fill="#526473" text-anchor="start" font-weight="400">Keep the chassis underside accessible</text>
<text x="720" y="744" font-size="17" fill="#526473" text-anchor="start" font-weight="400">until every nut has been installed.</text>
<text x="34" y="818" font-size="14" fill="#526473" text-anchor="start" font-weight="400">P1 Track carrier: track_carrier_s1.stl   |   P2 Fixed bracket: fixed_bracket_s1.stl</text>
<text x="34" y="842" font-size="14" fill="#526473" text-anchor="start" font-weight="400">P5 Chassis: chassis_p0.stl</text>
<line x1="34" y1="847" x2="1166" y2="847" stroke="#d4dde3" stroke-width="2"/>
<text x="34" y="871" font-size="14" fill="#526473" text-anchor="start" font-weight="400">S0/S1 candidate • simplified assembly illustration • dimensions in mm • not a fabrication template</text>
</g>
</svg>
