<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="888" viewBox="0 0 1200 888">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="DejaVu Sans,Arial,sans-serif" stroke-linejoin="round" stroke-linecap="round">
<text x="34" y="38" font-size="26" fill="#172b3a" text-anchor="start" font-weight="700">4  Attach the brackets before closing the track</text>
<text x="34" y="67" font-size="17" fill="#526473" text-anchor="start" font-weight="400">Two brackets per module • four M4 sets per module • feet point toward the chassis</text>
<line x1="34" y1="83" x2="1166" y2="83" stroke="#d4dde3" stroke-width="2"/>
<text x="45" y="125" font-size="19" fill="#172b3a" text-anchor="start" font-weight="700">A. M4 fastener stack — separated for clarity</text>
