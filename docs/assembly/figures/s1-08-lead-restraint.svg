<text x="45" y="655" font-size="16" fill="#526473" text-anchor="start" font-weight="400">Washer under head; washer + nyloc on base</text>
<text x="610" y="170" font-size="20" fill="#172b3a" text-anchor="start" font-weight="700">Existing chassis holes</text>
<text x="610" y="205" font-size="19" fill="#172b3a" text-anchor="start" font-weight="400">Rows 19 + 20 from FRONT</text>
<text x="610" y="231" font-size="19" fill="#172b3a" text-anchor="start" font-weight="400">Column 2 inward from EACH side</text>
<text x="610" y="257" font-size="19" fill="#172b3a" text-anchor="start" font-weight="400">Adjacent holes: 8 mm apart fore/aft</text>
<text x="610" y="283" font-size="16" fill="#526473" text-anchor="start" font-weight="400">148 / 156 mm from front; 12 mm from side</text>
<text x="610" y="320" font-size="20" fill="#172b3a" text-anchor="start" font-weight="700">Per stand</text>
<text x="610" y="355" font-size="18" fill="#172b3a" text-anchor="start" font-weight="400">2 × M3 × 16 socket bolts</text>
<text x="610" y="380" font-size="18" fill="#172b3a" text-anchor="start" font-weight="400">4 × Ø7 / Ø3.2 / 0.5 washers</text>
<text x="610" y="405" font-size="18" fill="#172b3a" text-anchor="start" font-weight="400">2 × M3 nyloc nuts, 4 mm high</text>
<text x="610" y="430" font-size="18" fill="#172b3a" text-anchor="start" font-weight="400">1 × 2.5 × 100 mm cable tie</text>
<text x="610" y="485" font-size="20" fill="#172b3a" text-anchor="start" font-weight="700">Cable centre at restraint</text>
<text x="610" y="525" font-size="18" fill="#172b3a" text-anchor="start" font-weight="400">X=−51, Y=±64, Z=46.25 mm</text>
<text x="610" y="550" font-size="18" fill="#172b3a" text-anchor="start" font-weight="400">Tie through both top slots.</text>
<text x="610" y="575" font-size="18" fill="#172b3a" text-anchor="start" font-weight="400">Close it without flattening the wires.</text>
<rect x="45" y="685" width="1110" height="90" rx="8" fill="#f0f3f5" stroke="#d4dde3" stroke-width="2"/>
<text x="62" y="714" font-size="18" fill="#172b3a" text-anchor="start" font-weight="700">Leave a removable connection</text>
<text x="62" y="742" font-size="16" fill="#526473" text-anchor="start" font-weight="400">Retain the factory 180 mm JST–JST lead. Keep its free end inboard for the later OpenCR connection; do not cut it.</text>
<text x="34" y="808" font-size="14" fill="#526473" text-anchor="start" font-weight="400">P5 Chassis: chassis_p0.stl   |   P7 Drive-lead restraint: drive_lead_restraint_s1.stl</text>
