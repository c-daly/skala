<text x="65" y="605" font-size="16" fill="#172b3a" text-anchor="start" font-weight="400">Top: M3×8 + steel washer</text>
<text x="65" y="628" font-size="16" fill="#172b3a" text-anchor="start" font-weight="400">Bottom: M3×10 + steel washer</text>
<text x="65" y="651" font-size="16" fill="#172b3a" text-anchor="start" font-weight="400">3.5 mm nominal engagement each end.</text>
<text x="65" y="674" font-size="16" fill="#172b3a" text-anchor="start" font-weight="400">No washer under the column ends.</text>
<text x="450" y="605" font-size="16" fill="#172b3a" text-anchor="start" font-weight="400">Top: M3×8 + steel washer</text>
<text x="450" y="628" font-size="16" fill="#172b3a" text-anchor="start" font-weight="400">Bottom: M3×8 + steel washer</text>
<text x="450" y="651" font-size="16" fill="#172b3a" text-anchor="start" font-weight="400">4.5 / 3.5 mm engagement.</text>
<text x="450" y="674" font-size="16" fill="#172b3a" text-anchor="start" font-weight="400">Opposing tips stay 4 mm apart.</text>
