<text x="1000" y="416" font-size="16" fill="#172b3a" text-anchor="start" font-weight="400">spacer</text>
<text x="835" y="665" font-size="16" fill="#172b3a" text-anchor="start" font-weight="400">OpenCR: M3×20, M3 nyloc</text>
<text x="835" y="688" font-size="16" fill="#172b3a" text-anchor="start" font-weight="400">Pi: M2.5×20, M2.5 nyloc</text>
<text x="835" y="711" font-size="16" fill="#172b3a" text-anchor="start" font-weight="400">Nylon washer on each PCB.</text>
<text x="835" y="734" font-size="16" fill="#172b3a" text-anchor="start" font-weight="400">Washer under each adapter, above nut.</text>
<rect x="50" y="785" width="1100" height="140" rx="8" fill="#f0f3f5" stroke="#d4dde3" stroke-width="2"/>
<text x="67" y="814" font-size="18" fill="#172b3a" text-anchor="start" font-weight="700">Order matters for access</text>
<text x="67" y="842" font-size="16" fill="#526473" text-anchor="start" font-weight="400">The OpenCR adapter covers the rear deck-column screw approaches. Tighten those deck screws first.</text>
<text x="67" y="865" font-size="16" fill="#526473" text-anchor="start" font-weight="400">The Pi board covers two adapter screw approaches. Attach all four short columns before adding the Pi.</text>
<text x="67" y="888" font-size="16" fill="#526473" text-anchor="start" font-weight="400">Board nuts are fitted with the adapter off the deck. Keep the lower ends of the long columns accessible.</text>
<text x="55" y="990" font-size="17" fill="#172b3a" text-anchor="start" font-weight="700">Use the exact washer/spacer sizes in the BOM; shorten no columns and add no hidden spacer layers.</text>
<text x="34" y="1078" font-size="14" fill="#526473" text-anchor="start" font-weight="400">P5 Chassis: chassis_p0.stl   |   P6 Upper deck: deck_p0.stl</text>
<text x="34" y="1102" font-size="14" fill="#526473" text-anchor="start" font-weight="400">P9 OpenCR adapter: opencr_adapter_s1.stl   |   P10 Pi 4B adapter: pi4_adapter_s1.stl</text>
