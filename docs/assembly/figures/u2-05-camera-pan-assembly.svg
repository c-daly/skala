<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1274" viewBox="0 0 1200 1274">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="DejaVu Sans,Arial,sans-serif" stroke-linejoin="round" stroke-linecap="round">
<text x="34" y="38" font-size="26" fill="#172b3a" text-anchor="start" font-weight="700">10C  The base and swivel join through the servo horn</text>
<text x="34" y="67" font-size="17" fill="#526473" text-anchor="start" font-weight="400">P13 stays fixed; P14 turns with the pan servo output. Exploded spacing is not to scale.</text>
<line x1="34" y1="83" x2="1166" y2="83" stroke="#d4dde3" stroke-width="2"/>
<text x="45" y="120" font-size="19" fill="#172b3a" text-anchor="start" font-weight="700">Exploded view — assemble from the bottom upward</text>
<image x="40" y="145" width="635" height="640" href="data:image/png;base64,"/>
<circle cx="371.53788231304844" cy="171.79355906780182" r="3" fill="#172b3a" stroke="#172b3a" stroke-width="2"/>
<line x1="371.53788231304844" y1="171.79355906780182" x2="732" y2="159" stroke="#172b3a" stroke-width="1.5"/>
<text x="740" y="165" font-size="18" fill="#172b3a" text-anchor="start" font-weight="700">Supplied centre screw</text>
<text x="740" y="190" font-size="16" fill="#526473" text-anchor="start" font-weight="400">Enters from ABOVE P14.</text>
<text x="740" y="213" font-size="16" fill="#526473" text-anchor="start" font-weight="400">Retains the horn on the servo shaft.</text>
<circle cx="321.31539652226644" cy="309.5436082913068" r="3" fill="#172b3a" stroke="#172b3a" stroke-width="2"/>
<line x1="321.31539652226644" y1="309.5436082913068" x2="732" y2="279" stroke="#172b3a" stroke-width="1.5"/>
<text x="740" y="285" font-size="18" fill="#172b3a" text-anchor="start" font-weight="700">P14 — rotating yoke / swivel</text>
<text x="740" y="310" font-size="16" fill="#526473" text-anchor="start" font-weight="400">Two M2 bolts attach the horn</text>
<text x="740" y="333" font-size="16" fill="#526473" text-anchor="start" font-weight="400">to the UNDERSIDE of its floor.</text>
<circle cx="387.2324091226678" cy="431.0560270685938" r="3" fill="#172b3a" stroke="#172b3a" stroke-width="2"/>
<line x1="387.2324091226678" y1="431.0560270685938" x2="732" y2="409" stroke="#172b3a" stroke-width="1.5"/>
<text x="740" y="415" font-size="18" fill="#172b3a" text-anchor="start" font-weight="700">Servo horn — bought part</text>
<text x="740" y="440" font-size="16" fill="#526473" text-anchor="start" font-weight="400">Orange part belongs to the servo.</text>
<text x="740" y="463" font-size="16" fill="#526473" text-anchor="start" font-weight="400">Its splined socket faces DOWN.</text>
<circle cx="371.53788231304844" cy="526.6042919162237" r="3" fill="#172b3a" stroke="#172b3a" stroke-width="2"/>
<line x1="371.53788231304844" y1="526.6042919162237" x2="732" y2="539" stroke="#172b3a" stroke-width="1.5"/>
<text x="740" y="545" font-size="18" fill="#172b3a" text-anchor="start" font-weight="700">Pan servo — body stays fixed</text>
<text x="740" y="570" font-size="16" fill="#526473" text-anchor="start" font-weight="400">Shaft points upward. Flange screws</text>
<text x="740" y="593" font-size="16" fill="#526473" text-anchor="start" font-weight="400">secure the servo inside P13.</text>
<circle cx="302.13319708828726" cy="727.0125965007182" r="3" fill="#172b3a" stroke="#172b3a" stroke-width="2"/>
<line x1="302.13319708828726" y1="727.0125965007182" x2="732" y2="669" stroke="#172b3a" stroke-width="1.5"/>
<text x="740" y="675" font-size="18" fill="#172b3a" text-anchor="start" font-weight="700">P13 — fixed camera base</text>
<text x="740" y="700" font-size="16" fill="#526473" text-anchor="start" font-weight="400">Four M3 sets attach it to the chassis.</text>
<text x="740" y="723" font-size="16" fill="#526473" text-anchor="start" font-weight="400">It does not bolt directly to P14.</text>
<text x="45" y="810" font-size="15" fill="#526473" text-anchor="start" font-weight="400">Printed shapes: current CAD. Horn, servo and screw: simplified bought-part illustrations.</text>
<line x1="34" y1="836" x2="1166" y2="836" stroke="#d4dde3" stroke-width="2"/>
<text x="45" y="875" font-size="22" fill="#172b3a" text-anchor="start" font-weight="700">Two different screw jobs</text>
<text x="45" y="913" font-size="18" fill="#236493" text-anchor="start" font-weight="700">A. Two V3 M2×10 bolts attach horn to yoke</text>
<rect x="87.5" y="949" width="55" height="4" rx="0" fill="#b5c0c9" stroke="#172b3a" stroke-width="2"/>
<rect x="30.0" y="953" width="170" height="28" rx="0" fill="#dcecf7" stroke="#172b3a" stroke-width="2"/>
<rect x="50.0" y="981" width="130" height="18" rx="0" fill="#ffe2c2" stroke="#172b3a" stroke-width="2"/>
<rect x="87.5" y="999" width="55" height="4" rx="0" fill="#b5c0c9" stroke="#172b3a" stroke-width="2"/>
<rect x="87.5" y="1003" width="55" height="15" rx="0" fill="#b5c0c9" stroke="#172b3a" stroke-width="2"/>
<line x1="115" y1="935" x2="115" y2="1026" stroke="#172b3a" stroke-width="5"/>
<rect x="100" y="934" width="30" height="12" rx="0" fill="#b5c0c9" stroke="#172b3a" stroke-width="2"/>
<text x="235" y="957" font-size="17" fill="#172b3a" text-anchor="start" font-weight="400">Head → washer → P14 floor</text>
<text x="235" y="985" font-size="17" fill="#172b3a" text-anchor="start" font-weight="400">→ horn → washer → M2 nut</text>
<text x="45" y="1060" font-size="17" fill="#172b3a" text-anchor="start" font-weight="400">Fit both bolts while the horn is off the servo.</text>
<text x="45" y="1084" font-size="17" fill="#172b3a" text-anchor="start" font-weight="400">The two slots match opposite horn holes</text>
<text x="45" y="1108" font-size="17" fill="#172b3a" text-anchor="start" font-weight="400">at radius 6–9 mm from the shaft centre.</text>
<line x1="615" y1="898" x2="615" y2="1157" stroke="#d4dde3" stroke-width="2"/>
<text x="650" y="913" font-size="18" fill="#a64c13" text-anchor="start" font-weight="700">B. One supplied screw retains the spline</text>
<text x="650" y="957" font-size="17" fill="#172b3a" text-anchor="start" font-weight="400">Pass it through P14&#x27;s centre opening.</text>
<text x="650" y="981" font-size="17" fill="#172b3a" text-anchor="start" font-weight="400">It threads into the servo output shaft.</text>
<text x="650" y="1005" font-size="17" fill="#172b3a" text-anchor="start" font-weight="400">Use the servo&#x27;s matched screw, not a V3 bolt.</text>
<text x="650" y="1029" font-size="17" fill="#172b3a" text-anchor="start" font-weight="400">Check its actual thread and reach.</text>
<text x="650" y="1092" font-size="17" fill="#172b3a" text-anchor="start" font-weight="700">P16 is NOT part of this pan joint.</text>
<text x="650" y="1116" font-size="17" fill="#172b3a" text-anchor="start" font-weight="700">It supports the separate sideways tilt pivot.</text>
<text x="34" y="1228" font-size="14" fill="#526473" text-anchor="start" font-weight="400">P13 Camera pan base: camera_pan_base_s1.stl   |   P14 Camera yoke: camera_yoke_s1.stl</text>
<line x1="34" y1="1233" x2="1166" y2="1233" stroke="#d4dde3" stroke-width="2"/>
<text x="34" y="1257" font-size="14" fill="#526473" text-anchor="start" font-weight="400">S0/S1 candidate • simplified assembly illustration • dimensions in mm • not a fabrication template</text>
</g>
</svg>
