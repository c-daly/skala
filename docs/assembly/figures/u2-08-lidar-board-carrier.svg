<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1454" viewBox="0 0 1200 1454">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="DejaVu Sans,Arial,sans-serif" stroke-linejoin="round" stroke-linecap="round">
<text x="34" y="38" font-size="26" fill="#172b3a" text-anchor="start" font-weight="700">10B  Where the LiDAR interface PCB goes</text>
<text x="34" y="67" font-size="17" fill="#526473" text-anchor="start" font-weight="400">P17 hangs below the rear of P12 • carrier mounting is defined; the PCB attachment is still to be designed</text>
<line x1="34" y1="83" x2="1166" y2="83" stroke="#d4dde3" stroke-width="2"/>
<text x="45" y="125" font-size="19" fill="#172b3a" text-anchor="start" font-weight="700">Installed carrier — rear strip of P12 shown</text>
<image x="45" y="145" width="545" height="340" href="data:image/png;base64,"/>
<circle cx="260.9816653934301" cy="340.068386363254" r="3" fill="#172b3a" stroke="#172b3a" stroke-width="2"/>
<line x1="260.9816653934301" y1="340.068386363254" x2="47" y2="509" stroke="#172b3a" stroke-width="1.5"/>
<text x="55" y="515" font-size="18" fill="#172b3a" text-anchor="start" font-weight="700">Two V5 columns, 15 mm long</text>
<text x="55" y="540" font-size="16" fill="#526473" text-anchor="start" font-weight="400">They suspend the carrier, not the PCB.</text>
<circle cx="353.18563789152023" cy="346.39659723544986" r="3" fill="#172b3a" stroke="#172b3a" stroke-width="2"/>
<line x1="353.18563789152023" y1="346.39659723544986" x2="362" y2="464" stroke="#172b3a" stroke-width="1.5"/>
<text x="370" y="470" font-size="18" fill="#172b3a" text-anchor="start" font-weight="700">P17 — slotted plate</text>
<text x="370" y="495" font-size="16" fill="#526473" text-anchor="start" font-weight="400">28 × 60 × 3 mm.</text>
<text x="655" y="125" font-size="19" fill="#172b3a" text-anchor="start" font-weight="700">Carrier fasteners — section, not to scale</text>
<rect x="700" y="245" width="425" height="28" rx="0" fill="#dcecf7" stroke="#236493" stroke-width="2"/>
<rect x="730" y="273" width="34" height="160" rx="0" fill="#b5c0c9" stroke="#172b3a" stroke-width="2"/>
