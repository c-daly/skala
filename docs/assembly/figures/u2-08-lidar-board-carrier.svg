<rect x="1055" y="457" width="44" height="5" rx="0" fill="#b5c0c9" stroke="#172b3a" stroke-width="2"/>
<rect x="1063" y="462" width="28" height="16" rx="0" fill="#b5c0c9" stroke="#172b3a" stroke-width="2"/>
<line x1="1077" y1="462" x2="1077" y2="400" stroke="#172b3a" stroke-width="4"/>
<text x="655" y="176" font-size="17" fill="#172b3a" text-anchor="start" font-weight="700">M2.5×8 + washer from ABOVE P12</text>
<line x1="747" y1="190" x2="747" y2="216" stroke="#236493" stroke-width="2" marker-end="url(#arrow)"/>
<text x="812" y="265" font-size="17" fill="#236493" text-anchor="start" font-weight="400">P12 bridge, 4 mm</text>
<text x="800" y="336" font-size="16" fill="#172b3a" text-anchor="start" font-weight="400">Space for the PCB and its</text>
<text x="800" y="363" font-size="16" fill="#172b3a" text-anchor="start" font-weight="400">insulating supports — their</text>
<text x="800" y="390" font-size="16" fill="#172b3a" text-anchor="start" font-weight="400">fit is not yet established.</text>
<text x="815" y="451" font-size="17" fill="#a64c13" text-anchor="start" font-weight="400">P17 carrier, 3 mm</text>
<line x1="747" y1="514" x2="747" y2="486" stroke="#a64c13" stroke-width="2" marker-end="url(#arrow)"/>
<text x="655" y="550" font-size="17" fill="#172b3a" text-anchor="start" font-weight="700">M2.5×8 + washer from BELOW P17</text>
<text x="655" y="590" font-size="17" fill="#172b3a" text-anchor="start" font-weight="400">Both columns are female–female: no nuts.</text>
<text x="655" y="614" font-size="17" fill="#172b3a" text-anchor="start" font-weight="400">The 15 mm gap is not a PCB standoff height.</text>
<line x1="34" y1="650" x2="1166" y2="650" stroke="#d4dde3" stroke-width="2"/>
<text x="45" y="693" font-size="21" fill="#172b3a" text-anchor="start" font-weight="700">P17 viewed from above</text>
<rect x="160" y="800" width="300" height="140" rx="0" fill="#ffe2c2" stroke="#a64c13" stroke-width="2"/>
<circle cx="430" cy="880" r="6.75" fill="white" stroke="#a64c13" stroke-width="2"/>
<circle cx="190" cy="880" r="6.75" fill="white" stroke="#a64c13" stroke-width="2"/>
<rect x="355" y="902.5" width="50" height="15" rx="0" fill="white" stroke="#a64c13" stroke-width="2"/>
<rect x="215" y="902.5" width="50" height="15" rx="0" fill="white" stroke="#a64c13" stroke-width="2"/>
<rect x="355" y="822.5" width="50" height="15" rx="0" fill="white" stroke="#a64c13" stroke-width="2"/>
<rect x="215" y="822.5" width="50" height="15" rx="0" fill="white" stroke="#a64c13" stroke-width="2"/>
<circle cx="190" cy="880" r="3" fill="#172b3a" stroke="#172b3a" stroke-width="2"/>
<line x1="190" y1="880" x2="37" y2="739" stroke="#172b3a" stroke-width="1.5"/>
<text x="45" y="745" font-size="18" fill="#172b3a" text-anchor="start" font-weight="700">Two round holes, 48 mm apart</text>
<text x="45" y="770" font-size="16" fill="#526473" text-anchor="start" font-weight="400">V5 columns attach here.</text>
<circle cx="380" cy="830" r="3" fill="#172b3a" stroke="#172b3a" stroke-width="2"/>
<line x1="380" y1="830" x2="359.109375" y2="1004" stroke="#172b3a" stroke-width="1.5"/>
<text x="45" y="1010" font-size="18" fill="#172b3a" text-anchor="start" font-weight="700">Four slots for future retention</text>
<text x="45" y="1035" font-size="16" fill="#526473" text-anchor="start" font-weight="400">Not the PCB&#x27;s mounting-hole pattern.</text>
<text x="320" y="779" font-size="16" fill="#236493" text-anchor="start" font-weight="700">FRONT ↑</text>
<text x="45" y="978" font-size="17" fill="#236493" text-anchor="start" font-weight="400">USB exits left ←</text>
<text x="655" y="693" font-size="21" fill="#172b3a" text-anchor="start" font-weight="700">Cable route — function only, not a pinout</text>
<rect x="655" y="733" width="490" height="80" rx="7" fill="#f0f3f5" stroke="#d4dde3" stroke-width="2"/>
<text x="675" y="761" font-size="18" fill="#172b3a" text-anchor="start" font-weight="700">SCANNER</text>
<text x="675" y="790" font-size="16" fill="#172b3a" text-anchor="start" font-weight="400">Fixed connector at the rear</text>
<rect x="655" y="863" width="490" height="80" rx="7" fill="#ffe2c2" stroke="#d4dde3" stroke-width="2"/>
<text x="675" y="891" font-size="18" fill="#172b3a" text-anchor="start" font-weight="700">BARE INTERFACE PCB ON P17</text>
<text x="675" y="920" font-size="16" fill="#172b3a" text-anchor="start" font-weight="400">Retained, insulated, below the bridge</text>
<rect x="655" y="993" width="490" height="80" rx="7" fill="#d9f1e6" stroke="#d4dde3" stroke-width="2"/>
<text x="675" y="1021" font-size="18" fill="#172b3a" text-anchor="start" font-weight="700">RASPBERRY PI USB</text>
<text x="675" y="1050" font-size="16" fill="#172b3a" text-anchor="start" font-weight="400">USB lead exits towards robot left</text>
<line x1="900" y1="817" x2="900" y2="857" stroke="#a64c13" stroke-width="2" marker-end="url(#arrow)"/>
<text x="675" y="844" font-size="16" fill="#a64c13" text-anchor="start" font-weight="400">Owned scanner cable</text>
<line x1="900" y1="947" x2="900" y2="987" stroke="#156f50" stroke-width="2" marker-end="url(#arrow)"/>
<text x="675" y="974" font-size="16" fill="#156f50" text-anchor="start" font-weight="400">USB cable</text>
<rect x="45" y="1120" width="1110" height="140" rx="8" fill="#f0f3f5" stroke="#d4dde3" stroke-width="2"/>
<text x="62" y="1149" font-size="18" fill="#172b3a" text-anchor="start" font-weight="700">What remains before attaching the PCB</text>
<text x="62" y="1177" font-size="16" fill="#526473" text-anchor="start" font-weight="400">Record its outline, mounting holes, underside components, connector directions and markings.</text>
<text x="62" y="1200" font-size="16" fill="#526473" text-anchor="start" font-weight="400">Then define insulating supports and positive retention; the 24 × 40 mm space is only an allowance.</text>
<text x="62" y="1223" font-size="16" fill="#526473" text-anchor="start" font-weight="400">Keep the PCB off screw heads and metalwork. Restrain cable jackets without loading the sockets.</text>
<text x="45" y="1320" font-size="17" fill="#172b3a" text-anchor="start" font-weight="700">The PCB stays stationary with P17. It is not a Pi GPIO HAT and does not attach to the rotating scanner.</text>
<text x="34" y="1408" font-size="14" fill="#526473" text-anchor="start" font-weight="400">P12 LiDAR bridge: lidar_bridge_s1.stl   |   P17 LiDAR interface carrier: lidar_interface_carrier_s1.stl</text>
<line x1="34" y1="1413" x2="1166" y2="1413" stroke="#d4dde3" stroke-width="2"/>
<text x="34" y="1437" font-size="14" fill="#526473" text-anchor="start" font-weight="400">S0/S1 candidate • simplified assembly illustration • dimensions in mm • not a fabrication template</text>
</g>
</svg>
