<text x="63" y="791" font-size="18" fill="#172b3a" font-weight="700" text-anchor="middle">A</text>
<text x="93" y="789" font-size="20" fill="#172b3a" font-weight="700" text-anchor="start">Split roof trim</text>
<text x="93" y="822" font-size="17" fill="#526473" font-weight="400" text-anchor="start">Separate around the LiDAR bridge.</text>
<text x="93" y="846" font-size="17" fill="#526473" font-weight="400" text-anchor="start">Keep the scanner mounted during removal.</text>
<circle cx="658" cy="784" r="17" fill="white" stroke="#172b3a" stroke-width="2"/>
<text x="658" y="791" font-size="18" fill="#172b3a" font-weight="700" text-anchor="middle">B</text>
<text x="688" y="789" font-size="20" fill="#172b3a" font-weight="700" text-anchor="start">Side service covers</text>
<text x="688" y="822" font-size="17" fill="#526473" font-weight="400" text-anchor="start">Open access to boards, ports and cable ties.</text>
<text x="688" y="846" font-size="17" fill="#526473" font-weight="400" text-anchor="start">Position holes from actual plugged-in hardware.</text>
<circle cx="63" cy="916" r="17" fill="white" stroke="#172b3a" stroke-width="2"/>
<text x="63" y="923" font-size="18" fill="#172b3a" font-weight="700" text-anchor="middle">C</text>
<text x="93" y="921" font-size="20" fill="#172b3a" font-weight="700" text-anchor="start">Mirrored front cheeks</text>
<text x="93" y="954" font-size="17" fill="#526473" font-weight="400" text-anchor="start">Keep the symmetric recess and gradual slope.</text>
<text x="93" y="978" font-size="17" fill="#526473" font-weight="400" text-anchor="start">Remove a cheek to reach the camera mechanism.</text>
<circle cx="658" cy="916" r="17" fill="white" stroke="#172b3a" stroke-width="2"/>
<text x="658" y="923" font-size="18" fill="#172b3a" font-weight="700" text-anchor="middle">D</text>
<text x="688" y="921" font-size="20" fill="#172b3a" font-weight="700" text-anchor="start">Rear service hatch</text>
<text x="688" y="954" font-size="17" fill="#526473" font-weight="400" text-anchor="start">Size the opening around the selected power bank.</text>
<text x="688" y="978" font-size="17" fill="#526473" font-weight="400" text-anchor="start">Keep the central drive-battery route separate.</text>
<circle cx="63" cy="1048" r="17" fill="white" stroke="#172b3a" stroke-width="2"/>
<text x="63" y="1055" font-size="18" fill="#172b3a" font-weight="700" text-anchor="middle">E</text>
<text x="93" y="1053" font-size="20" fill="#172b3a" font-weight="700" text-anchor="start">Detachable lower nose trim</text>
<text x="93" y="1083" font-size="17" fill="#526473" font-weight="400" text-anchor="start">Keep access to the front fixings and check the camera image at downward tilt.</text>
